# pve_pam_users.yml
---
- name: Ensure PAM (Linux) users exist on every Proxmox node
  hosts: pve
  become: true
  gather_facts: false

  vars:
    csv_path: "./users.csv"

  tasks:
    - name: Read CSV of users
      ansible.builtin.read_csv:
        path: "{{ csv_path }}"
      register: users_csv

    - name: Ensure required packages are present
      ansible.builtin.package:
        name: [ "passwd", "shadow" ]
        state: present

    - name: Create/ensure Linux PAM user accounts (per node)
      ansible.builtin.user:
        name: "{{ item.username }}"
        comment: "{{ item.name | default('') }}"
        password: "{{ item.password_hash | default(omit) }}"
        shell: "{{ item.shell | default('/bin/bash') }}"
        create_home: true
        state: present
      loop: "{{ users_csv.list }}"
      loop_control:
        label: "{{ item.username }}"

- name: Register users in Proxmox RBAC and assign groups/ACLs (run once)
  hosts: "{{ pve_api_first_node }}"
  become: true
  gather_facts: false

  vars:
    csv_path: "./users.csv"

  tasks:
    - name: Read CSV again (on the control node for RBAC)
      ansible.builtin.read_csv:
        path: "{{ csv_path }}"
      register: users_csv

    - name: Ensure PVE groups exist (from CSV groups column)
      vars:
        all_groups: >-
          {{
            users_csv.list
            | map(attribute='groups')
            | select('defined')
            | map('regex_replace','\\s+','')
            | map('split', ',')
            | flatten
            | select('length')
            | unique
          }}
      ansible.builtin.command:
        cmd: "pveum group add {{ item }} --comment 'Created by Ansible'"
      loop: "{{ all_groups }}"
      loop_control:
        label: "{{ item }}"
      register: add_group
      changed_when: add_group.rc == 0
      failed_when: add_group.rc not in [0,2]
      # pveum returns non-zero if exists in some versions; tolerate known conditions
      # pveum is the Proxmox user manager CLI. [2](https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/8-0/vsphere-security-8-0/virtual-machine-encryption/privileges-required-for-encryption-tasks.html)

    - name: Add user to Proxmox RBAC (user@realm) with comment (name)
      ansible.builtin.command:
        cmd: >-
          pveum user add {{ item.username }}@{{ item.realm }}
          --comment "{{ item.name | default('') }}"
      loop: "{{ users_csv.list }}"
      loop_control:
        label: "{{ item.username }}@{{ item.realm }}"
      register: add_user
      changed_when: add_user.rc == 0
      failed_when: add_user.rc not in [0,2]
      # Proxmox stores users in user.cfg cluster-wide; user add is idempotent guarded. [1](https://wiki.getshifting.com/esxpermissions)

    - name: Enable/disable + set expiry on user
      ansible.builtin.command:
        cmd: >-
          pveum user modify {{ item.username }}@{{ item.realm }}
          --enable {{ (item.enabled | default('1')) | int }}
          --expire {{ (item.expire | default('0')) | int }}
      loop: "{{ users_csv.list }}"
      loop_control:
        label: "{{ item.username }}@{{ item.realm }}"
      register: mod_user
      changed_when: mod_user.rc == 0
      failed_when: mod_user.rc not in [0,2]
      # User records support "enabled" and an optional expiry date. [1](https://wiki.getshifting.com/esxpermissions)

    - name: Assign PVE group membership per user
      vars:
        user_groups: >-
          {{
            (item.groups | default('') )
            | regex_replace('\\s+','')
          }}
      ansible.builtin.command:
        cmd: >-
          bash -lc '
          current=$(
            pveum user list | awk -v u="{{ item.username }}@{{ item.realm }}" "$1==u{print $6}"
          );
          new="{{ user_groups }}";
          if [ -z "$new" ]; then exit 0; fi
          merged=$(python3 - <<PY
g1=set(filter(None,"$current".split(",")))
g2=set(filter(None,"$new".split(",")))
print(",".join(sorted(g1.union(g2))))
PY
);
          pveum user modify {{ item.username }}@{{ item.realm }} --groups "$merged"
          '
      loop: "{{ users_csv.list }}"
      loop_control:
        label: "{{ item.username }}@{{ item.realm }}"
      register: mod_groups
      changed_when: "'modified' in (mod_groups.stdout | default('')) or mod_groups.rc == 0"
      failed_when: mod_groups.rc not in [0,2]
      # "pveum user modify --groups" updates the user groups in user.cfg. [2](https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/8-0/vsphere-security-8-0/virtual-machine-encryption/privileges-required-for-encryption-tasks.html)

    - name: Ensure Pool exists (optional)
      when: (pve_pool.name is defined) and (pve_pool.ensure_present | default(false))
      ansible.builtin.command:
        cmd: "pveum pool add {{ pve_pool.name }} --comment 'Created by Ansible'"
      register: pool_add
      changed_when: pool_add.rc == 0
      failed_when: pool_add.rc not in [0,2]
      # Pools are RBAC/grouping constructs (not compute resource pools). [1](https://wiki.getshifting.com/esxpermissions)

    - name: Apply ACL Role on path for all imported users (optional)
      when: pve_acl.enabled | default(false)
      ansible.builtin.command:
        cmd: >-
          pveum acl modify {{ pve_acl.path }}
          --users {{
            users_csv.list
            | map(attribute='username')
            | map('regex_replace','$','@' ~ (item.realm | default('pam'))) | unique
            | join(',')
          }}
          --role {{ pve_acl.role }}
          --propagate 1
      register: acl_mod
      changed_when: acl_mod.rc == 0
      failed_when: acl_mod.rc not in [0,2]
      # ACLs bind users/groups to roles on a path like /, /dc, /pool/<id>, etc. [2](https://techdocs.broadcom.com/us/en/vmware-cis/vsphere/vsphere/8-0/vsphere-security-8-0/virtual-machine-encryption/privileges-required-for-encryption-tasks.html)
