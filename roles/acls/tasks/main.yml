# 1) Read CSV on controller once
- name: Read CSV (users) on controller
  ansible.builtin.read_csv:
    path: "{{ users_csv_path }}"
  register: users_csv
  delegate_to: localhost
  run_once: true

- name: Share parsed CSV to all hosts
  ansible.builtin.set_fact:
    users_csv_list: "{{ users_csv.list }}"
  run_once: true

  
- name: Get current ACLs at path
  ansible.builtin.command: "pveum acl list --path {{ pve_acl_default.path }}"
  register: acl_list
  changed_when: false


# Apply ACL to each user only if:
# 1) user exists in PVE AND
# 2) acl_list does not already contain "user@realm <spaces> role"
- name: Apply ACL role per user if missing
  ansible.builtin.command: >
    pveum acl modify {{ pve_acl_default.path }}
    --users {{ item.username }}@{{ item.realm }}
    --role {{ pve_acl_default.role }}
    --propagate 1
  loop: "{{ users_csv_list }}"
  loop_control:
    label: "{{ item.username }}@{{ item.realm }}"
  when: >
    (pve_users_list.stdout | default('')) is search('{{ item.username }}@{{ item.realm }}')
    and not (acl_list.stdout | default('')) is search('{{ item.username }}@{{ item.realm }}\\s+{{ pve_acl_default.role }}')
  register: acl_apply
  changed_when: acl_apply.rc == 0
  failed_when: acl_apply.rc not in [0]

