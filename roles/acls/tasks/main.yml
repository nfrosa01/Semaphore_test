# 1) Read CSV on controller once
- name: Read CSV (users) on controller
  ansible.builtin.read_csv:
    path: "{{ users_csv_path }}"
  register: users_csv
  delegate_to: localhost
  run_once: true

- name: Share parsed CSV to all hosts
  ansible.builtin.set_fact:
    users_csv_list: "{{ users_csv.list }}"
  run_once: true

# 2) Apply ACLs based on CSV (only runs if ACL defaults enabled)
- name: Apply ACL role on path for all CSV users
  when: pve_acl_default.enabled | default(false)
  ansible.builtin.command:
    cmd: >-
      pveum acl modify {{ pve_acl_default.path }}
      --users {{
        users_csv_list
        | map(attribute='username')
        | map('regex_replace', '$', '@' ~ (pve_acl_default.realm | default('pam')))
        | join(',')
      }}
      --role {{ pve_acl_default.role }}
      --propagate 1
  register: acl_mod
  changed_when: acl_mod.rc == 0
  failed_when: acl_mod.rc not in [0,2]
