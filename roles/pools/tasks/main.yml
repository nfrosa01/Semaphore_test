---
# 1) Check each pool
- name: Check whether PVE pool exists
  ansible.builtin.command:
    cmd: "pveum pool list --poolid {{ item.name }}"
  loop: "{{ pve_pools | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: pool_check
  changed_when: false
  failed_when: false    # missing pool is not a failure

# 2) Create missing pools using indexed items
#    item.0 → index
#    item.1 → pool object from pve_pools
- name: Create PVE pool when absent
  ansible.builtin.command:
    cmd: "pveum pool add {{ item.1.name }} --comment '{{ item.1.comment | default('Created by Ansible') }}'"
  with_indexed_items: "{{ pve_pools | default([]) }}"
  when: pool_check.results[item.0].rc != 0
  register: pool_add
  changed_when: pool_add.rc == 0
  failed_when: pool_add.rc not in [0]
