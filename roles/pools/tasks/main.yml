---
# Idempotent pool creation without zip() & compatible with Ansible 2.13 (Semaphore)

- name: Check whether PVE pool exists
  ansible.builtin.command:
    cmd: "pveum pool list --poolid {{ item.name }}"
  loop: "{{ pve_pools | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: pool_check
  changed_when: false
  failed_when: false   # ignore rc!=0 for missing pools

- name: Create PVE pool when absent
  ansible.builtin.command:
    cmd: "pveum pool add {{ item.name }} --comment '{{ item.comment | default('Created by Ansible') }}'"
  loop: "{{ pve_pools | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: pool_check.results[ansible_loop.index0].rc != 0
  register: pool_add
  changed_when: pool_add.rc == 0
  failed_when: pool_add.rc not in [0]
