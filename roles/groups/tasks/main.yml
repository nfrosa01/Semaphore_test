---
# roles/groups/tasks/main.yml
# Purpose: Ensure PVE RBAC groups exist (if you want) and update group membership for LDAP-backed users.

- name: MARKER — you are executing roles/groups/tasks/group_membership.yml
  debug:
    msg: "Running main.yml"

# NOTE:
# - This role expects 'users_csv_list' to be set (you already do this in site.yml pre_tasks).
# - CSV schema: username, realm, groups  (groups can be comma-separated)
# - Example row: sa927362,Dart,u_rba_it_operations_sa

# (Optional) Ensure groups exist – enable this block if you also want to create groups from CSV
# Derive group names from the CSV 'groups' column
- name: Derive groups from CSV + extras
  ansible.builtin.set_fact:
    _csv_groups: >-
      {{
        users_csv_list
        | map(attribute='groups')
        | select('defined')
        | map('regex_replace','\\s+','')
        | map('split', ',')
        | flatten
        | reject('equalto','')
        | unique
      }}
    _wanted_groups: "{{ [] }}"   # set to _csv_groups if you want automatic creation
  run_once: true

# Uncomment this task if you want to auto-create groups from CSV:
# - name: Ensure PVE groups exist
#   ansible.builtin.command: "pveum group add {{ item }} --comment 'Created by Ansible'"
#   loop: "{{ _csv_groups }}"
#   loop_control:
#     label: "{{ item }}"
#   register: group_add
#   changed_when: group_add.rc == 0
#   failed_when: >
#     (group_add.rc != 0) and
#     ('already exists' not in (group_add.stderr | default('')))

# Load complete user table once – we’ll use this to test user existence and realm spelling
- name: Load current PVE user table
  ansible.builtin.command: "pveum user list"
  register: pve_users_table
  changed_when: false

# Read current groups for each user in CSV (exact match on userid@realm)
- name: Get current PVE groups for user
  ansible.builtin.shell: |
    set -o pipefail
    pveum user list | awk -v u="{{ item.username }}@{{ item.realm }}" '$1==u{print $6}'
  args:
    executable: /bin/bash
  loop: "{{ users_csv_list }}"
  loop_control:
    label: "{{ item.username }}@{{ item.realm }}"
  register: current_groups
  changed_when: false

# Compute desired groups per user (normalized from CSV ‘groups’ column)
- name: Compute desired groups for user (normalized CSV)
  ansible.builtin.set_fact:
    _desired_groups_list: >-
      {{
        users_csv_list
        | map(attribute='groups')
        | map('regex_replace','\\s+','')   # remove spaces
        | list
      }}
  run_once: true

# Show evaluation so we can see exactly why it would run or skip
- name: DEBUG | current vs desired (per user)
  ansible.builtin.debug:
    msg:
      user: "{{ users_csv_list[idx].username }}@{{ users_csv_list[idx].realm }}"
      exists_in_pve: "{{ (pve_users_table.stdout | default('')) is search(users_csv_list[idx].username ~ '@' ~ users_csv_list[idx].realm) }}"
      current_groups: "{{ (current_groups.results[idx].stdout | default('')) }}"
      desired_groups: "{{ _desired_groups_list[idx] | default('') }}"
      will_run_modify: "{{ ((pve_users_table.stdout | default('')) is search(users_csv_list[idx].username ~ '@' ~ users_csv_list[idx].realm))
                          and ((current_groups.results[idx].stdout | default('')) != (_desired_groups_list[idx] | default(''))) }}"
  loop: "{{ range(0, users_csv_list | length) | list }}"
  loop_control:
    index_var: idx

# Apply membership only if user exists and current != desired
- name: Apply PVE group membership when different
  ansible.builtin.command: >
    pveum user modify {{ users_csv_list[idx].username }}@{{ users_csv_list[idx].realm }}
    --groups "{{ _desired_groups_list[idx] }}"
  loop: "{{ range(0, users_csv_list | length) | list }}"
  loop_control:
    index_var: idx
    label: "{{ users_csv_list[idx].username }}@{{ users_csv_list[idx].realm }}"
  when: >
    (pve_users_table.stdout | default('')) is search(users_csv_list[idx].username ~ '@' ~ users_csv_list[idx].realm)
    and
    (current_groups.results[idx].stdout | default('')) != (_desired_groups_list[idx] | default(''))
  register: mod_membership
  changed_when: mod_membership.rc == 0
  failed_when: mod_membership.rc not in [0, 2]
  # If you want it to run even when someone toggles --check:
  # check_mode: no
