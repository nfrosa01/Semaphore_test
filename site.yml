---
# 1) Create PAM (Linux) users on *all* Proxmox nodes
- name: PAM (Linux) users on all Proxmox nodes
  hosts: pve
  become: true
  gather_facts: false
  roles:
    - { role: users, tasks_from: pam.yml }


# 2) Create RBAC (Proxmox) users and attributes on a single node
- name: RBAC — create Proxmox users from CSV
  hosts: "{{ pve_rbac_node | default('pve01') }}"
  become: true
  gather_facts: false


  pre_tasks:
    - name: RBAC preflight — show target host and pve_rbac_node var
      debug:
        msg:
          rbac_node_inventory_hostname: "{{ inventory_hostname }}"
          pve_rbac_node_var: "{{ pve_rbac_node | default('pve01') }}"

    - name: Read CSV (users) on controller (preflight)
      ansible.builtin.read_csv:
        path: "{{ users_csv_path }}"
      register: preflight_users_csv
      delegate_to: localhost
      run_once: true

    - name: Show first CSV row (preflight)
      debug:
        var: preflight_users_csv.list[0]
      run_once: true

    # Ensure this RBAC play performs real changes even if someone starts with --check
    #- name: End check mode for all RBAC operations
     # ansible.builtin.meta: end_check_mode

  roles:
    - { role: users,  tasks_from: pve_rbac.yml }   # Creates user@realm
    #- { role: groups }                              # Assign PVE groups
    #- { role: pools }                               # Ensure pools exist
    #- { role: roles }                               # Ensure custom RBAC roles exist
